<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>That Time I Got Reincarnated As A Spreadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*__STYLES__*/
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand" id="brand">That Time I Got Reincarnated As A Spreadsheet</h1>
    <div class="topbar-actions">
      <div class="add-box" id="addBox" hidden>
        <svg class="add-box-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="addInput" type="text" placeholder="Add an anime…" autocomplete="off" spellcheck="false">
        <div class="add-results" id="addResults" hidden></div>
      </div>
      <button class="icon-btn" id="themeToggle" title="Switch theme" aria-label="Switch theme">
        <svg id="iconSun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg id="iconMoon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="page">
  <section class="hero">
    <p class="hero-eyebrow" id="heroEyebrow">Your collection</p>
    <h2 class="hero-title" id="heroTitle">The stories waiting for you</h2>
    <p class="hero-sub" id="heroSub"></p>
  </section>

  <nav class="status-tabs" id="statusTabs" aria-label="Filter by status"></nav>

  <div class="controls">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="Search titles…" autocomplete="off">
    </div>
    <select id="genreSelect" class="select" aria-label="Filter by genre"><option value="">All genres</option></select>
    <select id="sortSelect" class="select" aria-label="Sort by">
      <option value="avg">Sort: Average</option>
      <option value="anilist">Sort: AniList</option>
      <option value="mal">Sort: MAL</option>
      <option value="imdb">Sort: IMDb</option>
      <option value="title">Sort: Title</option>
    </select>
    <div class="view-toggle" role="group" aria-label="View mode">
      <button id="viewGrid" class="view-btn active" title="Grid view" aria-label="Grid view"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      <button id="viewList" class="view-btn" title="List view" aria-label="List view"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
    <button id="surpriseBtn" class="pill-btn">Surprise me</button>
  </div>

  <div id="libraryGrid" class="grid"></div>
  <div id="emptyState" class="empty" hidden>
    <p class="empty-title">Nothing here yet</p>
    <p class="empty-sub" id="emptySub">Try a different filter, or add something new to the library.</p>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="icon-btn modal-close" id="modalClose" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>window.__DATA__ = "__DATA__";</script>
<script>
/*__APP__*/
</script>
</body>
</html>
